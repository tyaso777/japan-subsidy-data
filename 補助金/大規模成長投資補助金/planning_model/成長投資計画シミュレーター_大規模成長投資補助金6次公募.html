<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="大規模成長投資補助金6次公募の成長投資計画・将来PL・評価指標を検証する単独HTMLシミュレーター">
  <title>成長投資計画シミュレーター（Ver. 大規模成長投資補助金 6次公募）</title>
  <style>:root {
  --ink: #17211d;
  --muted: #65706b;
  --paper: #f4f1e9;
  --panel: #fffdf8;
  --line: #dcd8cd;
  --green: #1e6a4b;
  --green-soft: #dcecdf;
  --amber: #d6952a;
  --amber-ink: #80520d;
  --amber-soft: #f7e8c9;
  --muted-readable: #5b6661;
  --red: #b74335;
  --red-soft: #f5dcd8;
  --navy: #16271f;
  --chart-company: #1e6a4b;
  --chart-project: #d6952a;
  --chart-other: #667b91;
  --surface-header: #f3f0e8;
  --surface-warm: #f2efe7;
  --surface-emphasis: #f7f5ee;
  --border-control: #c9c4b8;
  --border-control-active: #99b4a4;
  --border-soft: #e9e5db;
  --row-divider: #ece8df;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 32px;
  --sans: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", Georgia, serif;
  --display-serif: var(--serif);
}

* { box-sizing: border-box; }

html { background: var(--paper); }

body {
  margin: 0;
  background:
    radial-gradient(circle at 88% 4%, rgba(214, 149, 42, .12), transparent 24rem),
    linear-gradient(180deg, #f8f6f0 0, var(--paper) 32rem);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
}

button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

main { width: min(calc(100% - 48px), 1920px); margin: 0 auto; padding: var(--space-6) 0 80px; }

.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-6); padding: var(--space-2) 0 var(--space-5); }
.topbar h1 { margin: 4px 0 6px; font-family: var(--display-serif); font-size: clamp(28px, 3vw, 40px); letter-spacing: .01em; font-weight: 600; font-variant-numeric: lining-nums; }
.product-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 16px; }.product-title small { color: var(--muted); font-family: var(--sans); font-size: clamp(12px, 1.2vw, 16px); font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.subtitle { margin: 0; color: var(--muted); font-size: var(--text-md); }
.proposal-filebar { display: grid; grid-template-columns: minmax(260px, 1fr) auto; align-items: end; gap: var(--space-2) var(--space-4); margin: calc(-1 * var(--space-3)) 0 var(--space-4); padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--space-3); background: rgba(255, 253, 248, .75); }
.proposal-filebar > label span { display: block; margin-bottom: var(--space-1); color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
.proposal-filebar > label input { width: min(100%, 480px); }
.proposal-file-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); }
.proposal-import-button, .proposal-action-menu > summary { display: inline-flex; align-items: center; min-height: 34px; border: 1px solid var(--border-control); background: var(--panel); color: var(--ink); padding: var(--space-2) var(--space-3); border-radius: var(--space-2); font-size: var(--text-sm); font-weight: 700; cursor: pointer; list-style: none; }
.proposal-action-menu { position: relative; }.proposal-action-menu > summary::-webkit-details-marker { display: none; }.proposal-action-menu > summary span { margin-left: var(--space-2); color: var(--muted); }.proposal-action-menu[open] > summary { border-color: var(--border-control-active); background: #f2f7f3; color: var(--green); }.proposal-action-menu.sample-menu:not([open]) > summary { color: var(--ink); border-color: var(--border-control); background: var(--panel); }
.proposal-action-menu-items { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; display: grid; min-width: 210px; gap: 5px; padding: 9px; border: 1px solid #d4d0c5; border-radius: 10px; background: var(--panel); box-shadow: 0 var(--space-3) 30px rgba(29, 43, 36, .16); }.proposal-action-menu-items small { padding: 3px 5px 6px; color: var(--muted); font-size: var(--text-xs); line-height: 1.4; }.proposal-action-menu-items button { width: 100%; border: 0; border-radius: 7px; background: transparent; padding: var(--space-2) 9px; color: var(--ink); font-size: var(--text-sm); font-weight: 700; text-align: left; }.proposal-action-menu-items button:hover { background: var(--green-soft); color: var(--green); }.sample-menu .proposal-action-menu-items { min-width: 300px; gap: 0; }.sample-menu-section { display: grid; gap: var(--space-1); padding: var(--space-2) 5px; }.sample-menu-section + .sample-menu-section { margin-top: 5px; padding-top: var(--space-3); border-top: 1px solid #e2ded4; }.sample-menu-section > strong { color: var(--green); font-size: var(--text-xs); letter-spacing: .04em; }.sample-menu-section > span { margin-bottom: 3px; color: var(--muted); font-size: var(--text-xs); line-height: 1.45; }
.proposal-import-button input { display: none; }
.proposal-filebar > small { grid-column: 1 / -1; color: var(--muted); font-size: var(--text-xs); }
.data-io-grid { display: grid; grid-template-columns: 1fr; align-items: stretch; gap: var(--space-4); }
.data-io-view .proposal-filebar { grid-template-columns: 1fr; align-content: start; margin: 0; padding: var(--space-5); }
.data-io-view .proposal-file-actions { justify-content: flex-start; }
.data-io-view .proposal-action-menu-items { right: auto; left: 0; }
.data-io-panel-heading { grid-column: 1 / -1; }.data-io-panel-heading h3 { margin: var(--space-1) 0 0; font-family: var(--serif); font-size: var(--text-xl); }.data-io-panel-heading > small { display: block; margin-top: var(--space-1); color: var(--muted); font-size: var(--text-xs); }
.sample-library-panel { padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--space-3); background: rgba(255, 253, 248, .75); }
.sample-library-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-4); }.sample-library-grid section { display: grid; align-content: start; gap: var(--space-2); padding: var(--space-4); border: 1px solid #ddd8cc; border-radius: 10px; background: var(--panel); }.sample-library-grid strong { color: var(--green); font-size: var(--text-sm); }.sample-library-grid span { min-height: var(--space-6); color: var(--muted); font-size: var(--text-xs); line-height: 1.55; }.sample-library-grid button { width: 100%; border: 1px solid var(--border-control); border-radius: var(--space-2); background: var(--panel); padding: var(--space-2) 10px; color: var(--ink); font-size: var(--text-sm); font-weight: 700; text-align: left; }.sample-library-grid button:hover { border-color: var(--border-control-active); background: var(--green-soft); color: var(--green); }
.data-io-status { margin: 0; padding: var(--space-3) var(--space-4); border-left: 3px solid var(--green); background: var(--green-soft); color: var(--muted); font-size: var(--text-sm); }
.load-success-notice { position: fixed; top: 68px; right: var(--space-5); z-index: 100; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); width: min(390px, calc(100vw - 32px)); padding: var(--space-3) var(--space-4); border: 1px solid #9fc4ae; border-radius: var(--space-3); background: #f5fbf6; color: var(--ink); box-shadow: 0 14px 34px rgba(25, 54, 40, .18); animation: load-notice-in .18s ease-out; }.load-success-notice > span:nth-child(2) { min-width: 0; }.load-success-notice strong, .load-success-notice small { display: block; }.load-success-notice strong { color: var(--green); font-size: var(--text-sm); }.load-success-notice small { margin-top: 2px; color: var(--muted); font-size: var(--text-xs); line-height: 1.45; }.load-success-icon { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 50%; background: var(--green); color: #fff; font-size: var(--text-md); font-weight: 700; }.load-success-notice button { align-self: start; border: 0; background: transparent; color: var(--muted); padding: 0 2px; font-size: var(--text-lg); line-height: 1; }.load-success-notice button:hover { color: var(--ink); }@keyframes load-notice-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.excel-mapping-panel { padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--space-3); background: rgba(255, 253, 248, .75); }
.excel-mapping-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-4); }
.excel-mapping-steps > section { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; min-width: 0; padding: 14px; border: 1px solid #ddd8cc; border-radius: 10px; background: var(--panel); }
.excel-mapping-steps .step-number { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 700; }
.excel-mapping-steps strong, .excel-mapping-steps small { display: block; }.excel-mapping-steps strong { font-size: var(--text-md); }.excel-mapping-steps small { overflow: hidden; margin-top: 2px; color: var(--muted); font-size: var(--text-xs); text-overflow: ellipsis; white-space: nowrap; }
.excel-mapping-steps .proposal-import-button, .excel-mapping-actions { grid-column: 1 / -1; }.excel-mapping-steps .proposal-import-button { justify-content: center; }
.excel-mapping-actions { display: flex; gap: var(--space-2); }.excel-mapping-actions button, .excel-mapping-resources button, .excel-mapping-preview-heading button { border: 1px solid var(--border-control); border-radius: var(--space-2); background: var(--panel); padding: var(--space-2) 10px; color: var(--ink); font-size: var(--text-xs); font-weight: 700; }.excel-mapping-actions button { flex: 1; }.excel-mapping-actions button:hover, .excel-mapping-resources button:hover { border-color: var(--border-control-active); background: var(--green-soft); color: var(--green); }
.excel-mapping-resources { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); padding: var(--space-3); border-left: 3px solid var(--amber); background: var(--surface-warm); }.excel-mapping-resources span { margin-right: auto; color: var(--muted); font-size: var(--text-xs); }
.excel-mapping-preview { margin-top: 14px; }.excel-mapping-preview-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }.excel-mapping-preview-heading strong { font-size: 12px; }.excel-mapping-preview-heading span { margin-right: auto; color: var(--muted); font-size: 11px; }.excel-mapping-preview-heading button { border-color: #9dbca9; background: var(--green-soft); color: var(--green); }.excel-mapping-preview-heading button:disabled { cursor: not-allowed; opacity: .45; }
.excel-mapping-preview table { min-width: 940px; }.excel-mapping-preview th:first-child { min-width: 310px; }.excel-mapping-preview td:last-child { min-width: 185px; white-space: normal; }.excel-mapping-preview td:last-child small { color: var(--muted); }.excel-mapping-preview .mapping-error th, .excel-mapping-preview .mapping-error td { background: #fff0ed; color: #8f2f25; }.excel-mapping-preview .mapping-empty th, .excel-mapping-preview .mapping-empty td { color: var(--muted); }
.excel-mapping-status { margin: var(--space-3) 0 0; padding: var(--space-2) var(--space-3); border-left: 3px solid var(--green); background: var(--green-soft); color: var(--muted); font-size: var(--text-xs); white-space: pre-line; }
.eyebrow, .card-kicker { margin: 0; color: var(--green); font-size: 13px; font-weight: 700; }
.eyebrow { letter-spacing: .13em; text-transform: uppercase; }
.card-kicker { letter-spacing: .02em; }
.header-actions { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.mode-switch { display: flex; padding: 4px; background: #e7e3d9; border-radius: 12px; }
.mode-switch button { border: 0; color: var(--muted); background: transparent; padding: 10px 14px; border-radius: 9px; font-size: 13px; font-weight: 700; }
.mode-switch button.active { color: var(--ink); background: var(--panel); box-shadow: 0 2px 10px rgba(25, 35, 30, .08); }
.input-mode-setting { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); margin: var(--space-4) 0 var(--space-2); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border-soft); }
.input-mode-setting strong, .input-mode-setting small { display: block; }.input-mode-setting small { color: var(--muted); font-size: 11px; margin-top: 4px; }
.future-basis-setting { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); margin: var(--space-4) 0 var(--space-2); padding: var(--space-3) 0 var(--space-4); border-bottom: 1px solid var(--border-soft); }.future-basis-setting strong, .future-basis-setting small { display: block; }.future-basis-setting small { color: var(--muted); font-size: var(--text-xs); margin-top: var(--space-1); }
.grid-operation-status { margin: -4px 4px 0; color: var(--muted); font-size: 12px; }.spreadsheet-grid tbody td { cursor: cell; }.spreadsheet-grid tbody td.grid-selected { background: #e8f1ff; box-shadow: inset 0 0 0 2px #4b8edb; }.spreadsheet-grid tbody td.grid-selected input { background: #f7fbff; }
.solve-button { border: 0; background: var(--amber); color: #211b10; padding: 14px 19px; border-radius: 11px; font-weight: 700; box-shadow: 0 7px 20px rgba(166, 111, 20, .2); }
.solve-button:hover { filter: brightness(.96); transform: translateY(-1px); }
.reset-button { border: 1px solid var(--border-control); background: var(--panel); color: var(--ink); padding: var(--space-3) var(--space-4); border-radius: 11px; font-size: var(--text-md); font-weight: 700; }
.default-button { border: 1px solid #b9cfc1; background: var(--green-soft); color: var(--green); padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; }
.default-button:hover { filter: brightness(.97); }
.default-note { margin: 12px 0 0; padding: 11px 13px; border-left: 3px solid var(--green); background: #eef6f0; color: #3f5e4d; font-size: 12px; line-height: 1.6; }
.benchmark-note { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-top: var(--space-3); padding: var(--space-3); background: var(--surface-warm); border-left: 3px solid var(--amber); font-size: var(--text-xs); }.benchmark-note strong { margin-right: var(--space-1); }.benchmark-note span { color: #525e58; }.benchmark-note a { margin-left: auto; color: var(--green); font-weight: 700; }
.workflow-actions { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 18px; border: 1px solid #d6d1c5; border-radius: 14px; background: rgba(255, 253, 248, .72); color: var(--muted); font-size: 13px; }

.tabs { position: sticky; top: 0; z-index: 25; display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; background: rgba(248, 246, 240, .96); backdrop-filter: blur(10px); }
.tabs button { background: transparent; border: 0; color: var(--muted); padding: 13px 18px; font-size: 13px; font-weight: 700; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs button.active { color: var(--green); border-color: var(--green); }
.tab-group-separator { align-self: center; flex: 0 0 auto; margin: 0 8px; color: #b8b3a8; font-size: 16px; line-height: 1; }

.page-grid { display: grid; gap: 18px; }
.summary-grid { grid-template-columns: 1.4fr repeat(3, 1fr); align-items: stretch; }
.hero-card, .stat-card, .panel { border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(30, 40, 35, .035); }
.dark-card { background: #edf4ef; color: var(--ink); border-color: #c8d8ce; }
.hero-card { display: flex; align-items: center; justify-content: space-between; padding: 27px 28px; }
.hero-card h2 { margin: var(--space-2) 0 var(--space-1); font-family: var(--display-serif); font-size: var(--text-2xl); font-weight: 600; font-variant-numeric: lining-nums; }
.hero-card p:not(.card-kicker) { color: var(--muted-readable); font-size: 13px; margin: 0; }
.score-ring { width: 88px; height: 88px; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 8px solid #b8d0c0; outline: 1px solid #7fa08d; background: #f8fbf9; }
.score-ring strong { color: var(--ink); font-size: var(--text-2xl); line-height: 1; }.score-ring span { color: #42584c; font-size: var(--text-sm); }.score-ring small { display: block; color: var(--muted-readable); font-size: var(--text-xs); margin-top: 2px; }
.stat-card { background: var(--panel); padding: 23px; display: flex; flex-direction: column; justify-content: center; }
.stat-card span { color: var(--muted); font-size: var(--text-sm); }.stat-card strong { font-family: var(--display-serif); font-size: var(--text-2xl); font-weight: 600; font-variant-numeric: lining-nums; margin: var(--space-3) 0 var(--space-1); }.stat-card small { color: var(--muted-readable); font-size: var(--text-md); }
.panel { background: var(--panel); padding: 24px; }
.metric-overview { grid-column: span 3; }.validation-panel { grid-column: span 1; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
.panel-heading h2, .panel > h2 { margin: var(--space-1) 0 0; font-family: var(--display-serif); font-size: var(--text-xl); font-weight: 600; font-variant-numeric: lining-nums; }
.text-button { color: var(--green); border: 0; background: transparent; font-size: 12px; font-weight: 700; }
.metric-list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; }
.metric-row { display: grid; grid-template-columns: 10px minmax(190px, 1fr) 105px 108px; align-items: center; gap: 10px; min-height: 58px; border-top: 1px solid var(--row-divider); }
.metric-row:nth-child(-n+2) { border-top: 0; }
.metric-row strong { display: block; font-size: 12px; }.metric-row small { display: block; color: var(--muted-readable); font-size: 11px; margin-top: 3px; }
.metric-value { font-size: 13px; font-weight: 700; text-align: right; }.metric-target { color: var(--muted); font-size: 12px; text-align: right; }
.before-metric { display: block; color: var(--muted-readable); font-size: 11px; font-weight: 400; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }.status-dot.ok { background: var(--green); }.status-dot.bad { background: var(--red); }
.solve-note { background: var(--surface-warm); border-left: 3px solid var(--amber); padding: var(--space-3); font-size: var(--text-md); line-height: 1.6; }
.validation-list { display: grid; gap: 8px; }
.validation { padding: 10px 11px; border-radius: 9px; background: #f4f2ec; border-left: 3px solid #a8afa9; }
.validation.warning { background: var(--amber-soft); border-color: var(--amber); }.validation.error { background: var(--red-soft); border-color: var(--red); }.validation.info { background: var(--green-soft); border-color: var(--green); }
.validation strong { font-size: 13px; }.validation p { margin: 3px 0 0; color: #59635e; font-size: 12px; line-height: 1.5; }
.footnote { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 14px 0 0; }

.content-stack { display: grid; gap: 18px; }
.section-intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; padding: 9px 4px 13px; }
.section-intro h2 { margin: 5px 0 0; font-family: var(--display-serif); font-size: 32px; font-weight: 600; font-variant-numeric: lining-nums; letter-spacing: .01em; }.section-intro > p { color: var(--muted); max-width: 550px; font-size: 12px; line-height: 1.7; margin: 0; }
.two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.input-list { display: grid; gap: 1px; }
.input-list label, .driver-grid label { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding: var(--space-2) 10px; border-bottom: 1px solid var(--row-divider); }
.input-list label > span, .driver-grid label > span { font-size: 12px; font-weight: 700; }.input-list small, .driver-grid small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
input, select { border: 1px solid #d7d2c7; background: #fffefa; color: var(--ink); border-radius: 7px; padding: 8px 9px; }
.input-list input, .driver-grid input { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
.driver-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 24px; }.driver-grid label.movable { background: linear-gradient(90deg, transparent, rgba(247, 232, 201, .38)); }.driver-grid label.fixed { background: linear-gradient(90deg, transparent, rgba(220, 236, 223, .4)); }
.driver-values { display: flex; width: 100%; align-items: center; justify-content: flex-end; gap: 7px; }.driver-values .adjusted-value { color: var(--green); font-weight: 700; white-space: nowrap; }
.application-category-control { display: grid; width: min(100%, 560px); gap: 8px; }
.application-category-copy { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.application-category-copy strong { font-size: 12px; }
.application-category-copy small { color: var(--muted); font-size: 11px; }
.application-category-control select { width: 100%; min-width: 0; }
.statutory-summary { margin-top: 16px; }
.statutory-condition { min-width: 165px; max-width: 230px; color: #315b46; background: #f1f7f3; text-align: center; white-space: normal; line-height: 1.45; }
.statutory-condition strong { display: block; margin-inline: auto; font-size: 11px; }

.chart-unit-control, .chart-scale-control { display: grid; justify-items: end; gap: var(--space-1); }.chart-unit-control > span, .chart-scale-control > span { color: var(--muted); font-size: var(--text-xs); font-weight: 700; }.chart-unit-control select { min-width: 150px; min-height: 34px; border: 1px solid var(--border-control); border-radius: var(--space-2); background: var(--panel); padding: 6px 30px 6px 10px; color: var(--ink); font-size: var(--text-sm); font-weight: 700; }.chart-scale-control .mode-switch button { min-width: 112px; padding: 7px 10px; font-size: var(--text-xs); }.chart-unit-control > small, .chart-scale-control > small { color: var(--muted); font-size: var(--text-xs); }
.diagnostic-chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }.trend-chart-card { min-width: 0; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--space-4); background: var(--panel); box-shadow: 0 var(--space-3) 30px rgba(30, 40, 35, .035); }.trend-chart-title { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }.trend-chart-title h3 { margin: 0; font-family: var(--display-serif); font-size: var(--text-xl); font-weight: 600; font-variant-numeric: lining-nums; letter-spacing: .01em; }.trend-chart-title p { margin: var(--space-1) 0 0; color: var(--muted); font-size: var(--text-xs); }.trend-chart-title > span { flex: 0 0 auto; padding: var(--space-1) 7px; border-radius: 999px; background: #f1eee6; color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
.trend-chart-svg { display: block; width: 100%; height: auto; margin-top: var(--space-2); overflow: visible; }.trend-chart-future-area { fill: rgba(30, 106, 75, .045); }.trend-chart-gridline { stroke: #e5e0d5; stroke-width: 1; }.trend-chart-base-line { stroke: #b99a66; stroke-width: 1; stroke-dasharray: 3 4; }.trend-chart-axis-label, .trend-chart-year, .trend-chart-boundary-label { fill: var(--muted); font-family: var(--sans); font-size: var(--text-xs); }.trend-chart-boundary-label { fill: #7c6a4d; font-size: var(--text-xs); font-weight: 700; }.trend-chart-line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; vector-effect: non-scaling-stroke; }.trend-chart-line.forecast { stroke-dasharray: 7 5; }.trend-chart-point { stroke-width: 2; vector-effect: non-scaling-stroke; }
.trend-chart-legend { display: flex; flex-wrap: wrap; gap: 7px 16px; padding: 3px 4px 0; }.trend-chart-legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }.trend-chart-legend i { width: 8px; height: 8px; border-radius: 50%; }.trend-chart-legend strong { margin-left: 2px; color: var(--ink); font-variant-numeric: tabular-nums; }.trend-chart-note { margin: 0 4px; color: var(--muted); font-size: 11px; line-height: 1.6; }.trend-chart-note span { display: inline-block; width: 18px; margin: 0 5px 2px 10px; border-top: 2px solid var(--green); }.trend-chart-note span:first-child { margin-left: 0; }.trend-chart-note .dash-sample { border-top-style: dashed; }
.financial-diagnostics { grid-column: 1 / -1; display: grid; gap: var(--space-4); min-width: 0; }.diagnostic-heading { display: flex; align-items: end; justify-content: space-between; gap: var(--space-5); padding: var(--space-1); }.diagnostic-heading h2, .diagnostic-panel h3 { margin: var(--space-1) 0 0; font-family: var(--display-serif); font-weight: 600; font-variant-numeric: lining-nums; letter-spacing: .01em; }.diagnostic-heading p:last-child { max-width: 560px; margin: 0; color: var(--muted); font-size: var(--text-sm); }.diagnostic-selected-chart { width: min(100%, 1040px); }.diagnostic-selected-chart .trend-chart-card { padding-block: var(--space-3); }.diagnostic-groups-scroll { display: grid; gap: var(--space-3); height: clamp(360px, 46vh, 520px); min-width: 0; overflow-x: hidden; overflow-y: auto; padding: 0 var(--space-1) var(--space-1) 0; overscroll-behavior: contain; scrollbar-gutter: stable; }.diagnostic-groups-scroll .diagnostic-panel { margin: 0; }.diagnostic-panel h3 { font-size: var(--text-xl); }.diagnostic-table th:nth-child(2), .diagnostic-table td:nth-child(2) { width: 260px !important; min-width: 260px !important; }.diagnostic-table th:nth-child(3), .diagnostic-table td:nth-child(3) { width: 300px !important; min-width: 300px !important; }.diagnostic-table .diagnostic-copy { white-space: normal; text-align: left; color: var(--muted); line-height: 1.55; }.diagnostic-sparkline-column, .diagnostic-sparkline-cell { width: 132px !important; min-width: 132px !important; max-width: 132px !important; padding-inline: var(--space-2) !important; }.diagnostic-sparkline-button { display: block; width: 120px; padding: 3px 2px; border: 1px solid transparent; border-radius: var(--space-2); background: transparent; color: var(--ink); cursor: pointer; }.diagnostic-sparkline-button:hover { background: var(--surface-emphasis); }.diagnostic-sparkline-button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }.diagnostic-sparkline { display: block; width: 116px; height: 44px; overflow: visible; }.diagnostic-sparkline line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }.diagnostic-sparkline path { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }.diagnostic-selected-row > th, .diagnostic-selected-row > td { background: rgba(220, 236, 223, .22); }.diagnostic-values { display: grid; gap: 3px; }.diagnostic-values span { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }.diagnostic-values small { color: var(--muted); font-size: var(--text-xs); }.diagnostic-values strong { font-size: var(--text-sm); }
.diagnostic-selected-chart { position: sticky; top: 46px; z-index: 20; width: 100%; padding: 0 0 var(--space-2); background: rgba(248, 246, 240, .98); backdrop-filter: blur(10px); }
.diagnostic-selected-chart .trend-chart-card { width: min(100%, 820px); }
.diagnostic-groups { display: grid; gap: var(--space-3); min-width: 0; overflow: visible; }
.diagnostic-groups .diagnostic-panel { margin: 0; }
.result-badge { display: inline-block; border-radius: 999px; padding: 5px 8px; color: #7d561b; background: var(--amber-soft); font-size: 11px; font-weight: 700; }.result-badge.ok { color: var(--green); background: var(--green-soft); }.result-badge.bad { color: var(--red); background: var(--red-soft); }

.logic-flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; align-items: center; gap: 10px; }
.logic-flow > div { min-height: 145px; border: 1px solid #c8d8ce; border-radius: 14px; background: #eef4ef; color: var(--ink); padding: 19px; }.logic-flow span { color: var(--green); font-family: var(--display-serif); font-variant-numeric: lining-nums; }.logic-flow strong { display: block; margin: 16px 0 8px; font-size: 13px; }.logic-flow p { margin: 0; color: var(--muted-readable); font-size: 12px; line-height: 1.6; }.logic-flow i { color: var(--amber-ink); font-style: normal; font-size: 20px; }
.formula-panel code { display: block; border: 1px solid #d7dfd9; background: #f3f6f3; color: #26372f; padding: 14px 16px; border-radius: 9px; margin-top: 12px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; white-space: normal; }.formula-panel p { color: var(--muted); font-size: 13px; line-height: 1.7; }
.formula-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }.formula-list > div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 15px 0; border-bottom: 1px solid #e8e4da; }.formula-list > div > span { color: var(--amber-ink); font-family: var(--display-serif); font-variant-numeric: lining-nums; }.formula-list strong, .formula-list code, .formula-list small { display: block; }.formula-list strong { font-size: 12px; }.formula-list code { margin: 6px 0; color: #42504a; font-size: 12px; white-space: normal; }.formula-list small { color: var(--muted); font-size: 11px; }
.source-note { padding: 18px 20px; background: #e7eadf; border-radius: 13px; }.source-note strong { font-size: 12px; }.source-note p { color: #4f5a54; font-size: 12px; line-height: 1.6; }.source-note a { color: var(--green); font-size: 12px; font-weight: 700; }

@media (max-width: 1100px) {
  .summary-grid { grid-template-columns: 1fr 1fr; }.hero-card { grid-column: span 2; }.metric-overview, .validation-panel { grid-column: span 2; }.driver-grid { grid-template-columns: 1fr 1fr; }.logic-flow { grid-template-columns: 1fr 1fr; }.logic-flow i { display: none; }
}

@media (max-width: 720px) {
  main { width: calc(100% - 24px); padding-top: var(--space-5); }.topbar, .section-intro, .diagnostic-heading, .diagnostic-chart-heading, .target-action-bar, .workflow-actions { align-items: stretch; flex-direction: column; }.diagnostic-chart-controls { align-items: stretch; flex-direction: column; }.chart-unit-control, .chart-scale-control { justify-items: stretch; }.proposal-filebar, .data-io-grid, .sample-library-grid, .excel-mapping-steps { grid-template-columns: 1fr; }.proposal-file-actions { justify-content: flex-start; }.proposal-action-menu-items { right: auto; left: 0; }.proposal-filebar > small { grid-column: auto; }.header-actions, .target-action-buttons { align-items: stretch; flex-direction: column; }.input-mode-setting, .future-basis-setting { align-items: stretch; flex-direction: column; }.mode-switch button { flex: 1; }.summary-grid, .two-column, .driver-grid, .metric-list, .formula-list, .logic-flow, .diagnostic-chart-grid, .metric-group-controls { grid-template-columns: 1fr; }.hero-card, .metric-overview, .validation-panel { grid-column: span 1; }.hero-card { align-items: flex-start; gap: var(--space-5); }.metric-row { grid-template-columns: 10px 1fr auto; }.metric-target { display: none; }.section-intro h2 { font-size: var(--text-2xl); }.trend-chart-card { padding: var(--space-4) var(--space-3) var(--space-3); }
  .load-success-notice { top: 58px; right: 12px; }
}

@media (max-width: 560px) {
  .application-category-copy { display: grid; gap: 3px; white-space: normal; }
}

*{box-sizing:border-box}
html{scroll-padding-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.report{max-width:1500px;margin:auto;padding:42px 34px 96px}
.cover{padding:30px 34px;background:var(--green);color:#fff;border-radius:18px}
.cover h1{margin:5px 0 12px;font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:.01em}
.cover p{margin:0;color:#dbe8e1}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:13px}
section{position:relative;margin-top:26px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px;page-break-inside:avoid}
section>h2{position:sticky;top:0;z-index:30;margin:-1px -1px 15px;padding:13px 1px 11px;background:#fff;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.01em}
.table-wrap{max-width:100%;overflow-x:auto;overflow-y:visible;scrollbar-width:none}
.table-wrap::-webkit-scrollbar{height:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content;font-size:12px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;background:#fff}
th:first-child{text-align:left}
tbody th:first-child{position:sticky;left:0;z-index:4;min-width:250px;max-width:430px;white-space:normal;background:#fff}
thead th{background:var(--green);color:#fff}
thead th:first-child{position:sticky;left:0;z-index:6;min-width:250px}
.emphasis th,.emphasis td{background:var(--soft);font-weight:700}
.emphasis th:first-child{background:var(--soft)}
small{display:block;font-weight:400;color:inherit;opacity:.75;margin-top:2px}
.copy{min-width:260px;white-space:normal;text-align:left;line-height:1.5}
.diagnostic-value{display:block;min-width:105px}
.diagnostic-value small{display:inline;margin-right:8px}
.note{color:var(--muted);font-size:11px;line-height:1.6}
.sticky-table-header{position:fixed;z-index:29;display:none;overflow:hidden;background:var(--green);box-shadow:0 2px 5px rgba(23,49,38,.16);pointer-events:none}
.sticky-table-header.is-visible{display:block}
.sticky-table-header-scroll{width:100%;overflow:hidden}
.sticky-table-header table{margin:0}
.sticky-table-header th{border-bottom:0}
.floating-table-scrollbar{position:fixed;bottom:0;z-index:60;display:none;height:18px;overflow-x:auto;overflow-y:hidden;background:#f1eee5;border:1px solid #c8c6bf;border-radius:9px 9px 0 0;box-shadow:0 -2px 7px rgba(23,49,38,.14)}
.floating-table-scrollbar.is-visible{display:block}
.floating-table-scrollbar-inner{height:1px}
.chart-section{padding-bottom:28px}
.chart-intro{margin:-5px 0 20px;color:var(--muted);font-size:13px}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.chart-card{min-width:0;padding:18px;border:1px solid var(--line);border-radius:12px;background:#fcfdfa}
.chart-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.chart-title h3{margin:0;font-size:16px}
.chart-title p{margin:4px 0 0;color:var(--muted);font-size:11px}
.chart-title>span{color:var(--muted);font-size:11px;white-space:nowrap}
.chart-svg{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.chart-future-area{fill:#f0f4f1}
.chart-gridline{stroke:#d7dfda;stroke-width:1}
.chart-base-line{stroke:#8da397;stroke-width:1.2;stroke-dasharray:3 4}
.chart-axis-label,.chart-year,.chart-boundary-label{fill:#607169;font-size:10px}
.chart-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart-line.forecast{stroke-dasharray:7 5}
.chart-point{stroke-width:2}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:5px;color:var(--muted);font-size:11px}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.chart-legend strong{color:var(--ink);font-variant-numeric:tabular-nums}
.chart-note{margin:16px 0 0;color:var(--muted);font-size:11px}
.solid-sample,.dash-sample{display:inline-block;width:25px;margin:0 6px 3px 12px;border-top:2px solid var(--green);vertical-align:middle}
.dash-sample{border-top-style:dashed}
@media(max-width:820px){
  .report{padding:18px 12px 80px}
  .cover{padding:22px 20px;border-radius:12px}
  .cover h1{font-size:25px}
  section{padding:14px 12px}
  section>h2{font-size:18px}
  .chart-grid{grid-template-columns:1fr}
  tbody th:first-child,thead th:first-child{min-width:210px;max-width:280px}
}
@media print{
  body{background:#fff}
  .report{max-width:none;padding:0}
  .cover{border-radius:0}

  tbody th:first-child,thead th:first-child{position:static;min-width:0}
  .sticky-table-header,.floating-table-scrollbar{display:none!important}
  .chart-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

\`\`\`json

## target
安定識別子は \`データ区分.期.第6次様式番号\` です。
- データ区分: \`balanceSheet\` / \`companyPL\` / \`projectPL\`
- 期: \`prePrevious\`（前々期）/ \`previous\`（前期）/ \`latest\`（最新決算期）

- sheet: Excelの正確なシート名
- cell: A1形式のセル番地

- export: シミュレーターから別Excelへの出力のみ
- both: 双方向（省略時）
