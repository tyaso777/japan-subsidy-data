name: Build PL Model React

on:
  push:
    branches:
      - main
    paths:
      - pl-model-react/**
      - .github/workflows/build-pl-model-react.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pl-model-react-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pl-model-react

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pl-model-react/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Upload built distribution
        uses: actions/upload-artifact@v7
        with:
          name: pl-model-react-dist
          path: pl-model-react/dist/
          if-no-files-found: error
          retention-days: 30
