name: Build PL Model React

on:
  push:
    branches:
      - main
    paths:
      - pl-model-react/**
      - .github/workflows/build-pl-model-react.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pl-model-react-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pl-model-react

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pl-model-react/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Upload built distribution
        uses: actions/upload-artifact@v7
        with:
          name: pl-model-react-dist
          path: pl-model-react/dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish public release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v7
        with:
          name: pl-model-react-dist
          path: release-assets

      - name: Package public release
        run: zip -j pl-model-react-dist.zip release-assets/index.html release-assets/subsidy-program.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="pl-model-react-${short_sha}"
          title="PL Model React ${short_sha}"
          notes="Automated build from commit ${GITHUB_SHA}. The ZIP contains index.html and subsidy-program.js. Keep both files in the same folder."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" pl-model-react-dist.zip --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" pl-model-react-dist.zip \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
